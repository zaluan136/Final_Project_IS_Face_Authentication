<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử chấm công — AttendCam</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V6a2 2 0 0 1 2-2h2"/>
            <path d="M4 16v2a2 2 0 0 0 2 2h2"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"/>
            <path d="M16 20h2a2 2 0 0 0 2-2v-2"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <span class="sidebar-brand-title">AttendCam</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Trang chủ</span>
        </a>
        <a href="/attendance" class="nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>Chấm công</span>
        </a>
        <a href="/history" class="nav-link active" aria-current="page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>Lịch sử chấm công</span>
        </a>
        <a href="/profile" class="nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Thông tin cá nhân</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button type="button" id="logoutBtn" class="btn logout-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Đăng xuất</span>
        </button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" id="menuToggleBtn" class="menu-toggle" aria-label="Mở menu điều hướng">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div>
            <h1 class="page-title">Lịch sử chấm công</h1>
            <p class="page-subtitle">Xem lại các lần chấm công của bạn</p>
          </div>
        </div>

        <div class="topbar-right">
          <div class="history-header-controls">
            <select id="historyMonthFilter" class="filter-select" aria-label="Lọc theo tháng">
              <option value="ALL">Tất cả các tháng</option>
            </select>
          </div>
          <div class="user-pill">
            <div id="userAvatar" class="avatar" aria-hidden="true">--</div>
          </div>
        </div>
      </header>

      <main class="content-container">
        <div id="historyAlert" class="alert alert-error" role="alert" style="margin-bottom: 16px;" hidden>
          <span id="historyAlertMsg"></span>
        </div>

        <section class="card">
          <div id="historyTableWrap" class="table-wrap">
            <div class="skeleton-stack">
              <div class="skeleton-row"></div>
              <div class="skeleton-row"></div>
              <div class="skeleton-row"></div>
              <div class="skeleton-row"></div>
            </div>
          </div>

          <div id="paginationBar" class="pagination-bar" hidden>
            <span id="paginationInfo">Trang 1 / 1</span>
            <div style="display: flex; gap: 8px;">
              <button type="button" id="prevPageBtn" class="btn btn-secondary btn-sm">Trước</button>
              <button type="button" id="nextPageBtn" class="btn btn-secondary btn-sm">Sau</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/js/history.js"></script>
</body>
</html>
