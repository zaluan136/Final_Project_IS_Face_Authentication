<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký khuôn mặt — AttendCam</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/auth.css"></head><body><main class="auth-form-panel"><section class="auth-card register-card"><h1>Tạo tài khoản</h1><p>Đăng ký khuôn mặt bằng webcam để dùng xác thực khi đăng nhập.</p><form id="registerForm"><label>Mã nhân viên<input class="form-input" name="employeeCode" required></label><label>Họ tên<input class="form-input" name="name" required></label><label>Email<input class="form-input" name="email" type="email" required></label><label>Mật khẩu (ít nhất 8 ký tự)<input class="form-input" name="password" type="password" minlength="8" required></label><label>Phòng ban<input class="form-input" name="department" required></label><div class="face-camera register-camera"><video id="registerVideo" autoplay muted playsinline></video><div class="face-guide" aria-hidden="true"></div></div><p id="registerStatus">Đang mở webcam…</p><button class="btn btn-primary auth-submit-btn" type="submit">Quét mặt và tạo tài khoản</button></form><p id="registerMessage" role="status"></p><a href="/login">Quay lại đăng nhập</a></section></main><script type="module" src="/js/register.js"></script></body></html>
